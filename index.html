<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Le mie serie e film visti</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --text: #e8e8f0;
    --muted: #9297ab;
    --border: #2a2d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  input, select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="text"] { flex: 1; min-width: 180px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 100px;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--accent2); }
  .stat .label { font-size: 12px; color: var(--muted); }

  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .item-main { flex: 1; }
  .item-title { font-weight: 600; font-size: 16px; }
  .item-note { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge.Film { background: rgba(108,92,231,0.2); color: var(--accent); }
  .badge.Serie { background: rgba(0,206,201,0.2); color: var(--accent2); }
  .rating { font-size: 14px; color: #f1c40f; font-weight: 700; }
  .date { font-size: 12px; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  #error { color: #ff7675; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 Cosa ho visto</h1>
  <div class="subtitle">Lista aggiornata automaticamente da <code>data.csv</code></div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Cerca titolo..." />
    <select id="filterType">
      <option value="">Tutti i tipi</option>
      <option value="Film">Film</option>
      <option value="Serie">Serie</option>
    </select>
    <select id="sortBy">
      <option value="date_desc">Data (più recente)</option>
      <option value="date_asc">Data (meno recente)</option>
      <option value="rating_desc">Voto (alto→basso)</option>
      <option value="rating_asc">Voto (basso→alto)</option>
      <option value="title_asc">Titolo (A-Z)</option>
    </select>
  </div>

  <div id="list"></div>
  <div id="error"></div>
</div>

<script>
let allData = [];

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('filterType').value;
  const sortBy = document.getElementById('sortBy').value;

  let filtered = allData.filter(item => {
    const matchSearch = item.title.toLowerCase().includes(search);
    const matchType = !type || item.type === type;
    return matchSearch && matchType;
  });

  filtered.sort((a, b) => {
    switch (sortBy) {
      case 'date_desc': return new Date(b.date_watched) - new Date(a.date_watched);
      case 'date_asc': return new Date(a.date_watched) - new Date(b.date_watched);
      case 'rating_desc': return parseFloat(b.rating) - parseFloat(a.rating);
      case 'rating_asc': return parseFloat(a.rating) - parseFloat(b.rating);
      case 'title_asc': return a.title.localeCompare(b.title);
    }
  });

  const list = document.getElementById('list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Nessun risultato trovato.</div>';
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="item">
      <div class="item-main">
        <div class="item-title">${escapeHtml(item.title)}</div>
        ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}
      </div>
      <div class="item-meta">
        <span class="badge ${item.type}">${item.type}</span>
        <span class="rating">★ ${item.rating}</span>
        <span class="date">${item.date_watched}</span>
      </div>
    </div>
  `).join('');

  renderStats(allData);
}

function renderStats(data) {
  const total = data.length;
  const films = data.filter(d => d.type === 'Film').length;
  const series = data.filter(d => d.type === 'Serie').length;
  const avgRating = total ? (data.reduce((s, d) => s + parseFloat(d.rating || 0), 0) / total).toFixed(1) : '-';

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Totali</div></div>
    <div class="stat"><div class="num">${films}</div><div class="label">Film</div></div>
    <div class="stat"><div class="num">${series}</div><div class="label">Serie</div></div>
    <div class="stat"><div class="num">${avgRating}</div><div class="label">Voto medio</div></div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Cache-busting per evitare che il browser mostri una versione vecchia del CSV
const csvUrl = 'data.csv?t=' + Date.now();

Papa.parse(csvUrl, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    allData = results.data.filter(d => d.title);
    render();
  },
  error: function(err) {
    document.getElementById('error').textContent = 'Errore nel caricamento di data.csv: ' + err.message;
  }
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterType').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
</script>
</body>
</html>
